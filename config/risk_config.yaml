version: "1.0.0"

# Normalized control weights for composite risk scoring (summing to 1.0)
control_weights:
  scope_violation: 0.35
  pii_leakage: 0.35
  groundedness: 0.30

# Score cutoffs for risk tiers (score is in [0.0, 100.0])
# score < low -> LOW
# score < medium -> MEDIUM
# score < high -> HIGH
# score >= high -> CRITICAL
tier_thresholds:
  low: 20.0
  medium: 50.0
  high: 80.0
  critical: 100.0

# Similarity cutoff above which a statement is deemed grounded in tool output
groundedness_similarity_threshold: 0.70

# Default severity level assignments by finding type
severity_mappings:
  scope:
    unauthorized_tool: "HIGH"
    unauthorized_data_source: "HIGH"
    max_calls_exceeded: "MEDIUM"
    rule_violation: "CRITICAL"
  pii:
    SSN: "CRITICAL"
    CREDIT_CARD: "CRITICAL"
    PASSWORD: "CRITICAL"
    IBAN_CODE: "HIGH"
    EMAIL_ADDRESS: "MEDIUM"
    PHONE_NUMBER: "MEDIUM"
    PERSON: "LOW"
    LOCATION: "LOW"
    DEFAULT: "MEDIUM"
  groundedness:
    unsupported_claim: "HIGH"
    contradicted_claim: "CRITICAL"
