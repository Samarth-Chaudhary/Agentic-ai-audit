[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-ai-audit"
version = "0.1.0"
description = "AI Agent Governance & Audit Trail Analyzer - Deterministic multi-control post-hoc audit pipeline with operational AWS serverless integration and reviewer dashboard"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Samarth Chaudhary", email = "chaudharysamarth784@gmail.com"}
]
dependencies = [
    "pydantic>=2.6.0,<3.0.0",
    "PyYAML>=6.0.1,<7.0.0",
    "jsonschema>=4.20.0,<5.0.0",
    "boto3>=1.34.0,<2.0.0",
    "openai>=1.20.0,<2.0.0",
    "presidio-analyzer>=2.2.350",
    "presidio-anonymizer>=2.2.350",
    "sentence-transformers>=2.5.0",
    "transformers>=4.38.0",
    "torch>=2.2.0",
    "streamlit>=1.32.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "moto>=5.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["project*", "agent*", "auditor*", "lambda*", "analytics*", "dashboard*", "scripts*"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
]
ignore = [
    "E501",  # line too long
    "B008",  # function call in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"dashboard/app.py" = ["E402"]

